name: Build Arsal YouTube Live Windows
on:
  push:
    branches: [arsal-youtube-live-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: arsal-youtube-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force resources/ffmpeg | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpacked
          $f = Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $p = Get-ChildItem ffmpeg-unpacked -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $f.FullName resources/ffmpeg/ffmpeg.exe
          Copy-Item $p.FullName resources/ffmpeg/ffprobe.exe
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build installers
        run: npm run dist:win
      - name: Stage smaller download artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact-setup | Out-Null
          New-Item -ItemType Directory -Force artifact-portable | Out-Null
          $setup = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE not found' }
          if (-not $portable) { throw 'Portable EXE not found' }
          Copy-Item $setup.FullName 'artifact-setup/Arsal-YouTube-Live-Ultra-Pro-Max-Setup.exe'
          Copy-Item $portable.FullName 'artifact-portable/Arsal-YouTube-Live-Ultra-Pro-Max-Portable.exe'
          Copy-Item docs/USER_GUIDE.md artifact-setup/USER_GUIDE.md
          Copy-Item docs/USER_GUIDE.md artifact-portable/USER_GUIDE.md
      - uses: actions/upload-artifact@v4
        with:
          name: arsal-youtube-live-setup
          path: arsal-youtube-live/artifact-setup/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: arsal-youtube-live-portable
          path: arsal-youtube-live/artifact-portable/*
          if-no-files-found: error
          compression-level: 0